[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparselora"
version = "1.0.0"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
description = "SparseLoRA: Accelerating LLM Fine-Tuning with Contextual Sparsity"
authors = [
    {name = "Samir Khaki", email = "samir.khaki@mail.utoronto.ca"},
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "liger-kernel",
    "safetensors",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
train = [
    "datasets",
    "accelerate>=0.25.0",
    "trl",
    "liger-kernel",
    "sentencepiece",
    "tabulate",
    "openpyxl",
    "pandas",
    "rich",
    "pydantic",
]
dev = [
    "black",
    "isort",
    "flake8",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.setuptools.packages.find]
include = ["sparselora*"]
